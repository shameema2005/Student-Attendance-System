{% extends "base.html" %}{% block content %}<h2>Mark / Update Attendance</h2><div class="card"><form method="post"><label>Student</label><select name="student_id" required>{% for s in students %}<option value="{{ s.id }}">{{ s.roll_number }} - {{ s.name }}</option>{% endfor %}</select><label>Date</label><input type="date" name="date" required><label>Status</label><select name="status"><option>Present</option><option>Absent</option></select><button>Save Attendance</button></form></div><h3>Attendance records</h3><div class="tablebox"><table><tr><th>Roll number</th><th>Name</th><th>Date</th><th>Status</th></tr>{% for r in records %}<tr><td>{{ r.roll_number }}</td><td>{{ r.name }}</td><td>{{ r.date }}</td><td>{{ r.status }}</td></tr>{% else %}<tr><td colspan="4">No records yet.</td></tr>{% endfor %}</table></div>{% endblock %}
