{% extends "base.html" %}{% block content %}<h2>Enter Internal Marks</h2><div class="card"><form method="post"><label>Student</label><select name="student_id" required>{% for s in students %}<option value="{{ s.id }}">{{ s.roll_number }} - {{ s.name }}</option>{% endfor %}</select><label>Subject</label><input name="subject" required><label>Marks (0-100)</label><input type="number" name="marks" min="0" max="100" required><button>Save Marks</button></form></div><div class="tablebox"><table><tr><th>Roll number</th><th>Student</th><th>Subject</th><th>Marks</th></tr>{% for m in records %}<tr><td>{{ m.roll_number }}</td><td>{{ m.name }}</td><td>{{ m.subject }}</td><td>{{ m.marks }}</td></tr>{% else %}<tr><td colspan="4">No marks entered.</td></tr>{% endfor %}</table></div>{% endblock %}
