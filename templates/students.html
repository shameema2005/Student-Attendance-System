{% extends "base.html" %}{% block content %}<h2>Students</h2><p><a class="btn" href="{{ url_for('add_student') }}">Add student</a></p><div class="tablebox"><table><tr><th>Name</th><th>Roll number</th><th>Department</th><th>Year</th></tr>{% for s in students %}<tr><td>{{ s.name }}</td><td>{{ s.roll_number }}</td><td>{{ s.department }}</td><td>{{ s.year }}</td></tr>{% else %}<tr><td colspan="4">No students added.</td></tr>{% endfor %}</table></div>{% endblock %}
